<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — Sofra · Anatolian kitchen in Dhaka</title>
  <meta name="description" content="The story of Sofra — southern Anatolian food cooked over charcoal and in clay, in Gulshan, Dhaka.">
  <meta property="og:title" content="About — Sofra">
  <meta property="og:image" content="https://sofra.com.bd/assets/img/photos/hero-about.jpg">
  <meta name="theme-color" content="#54131e">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@200;300;400&family=Noto+Serif+Bengali:wght@500;600&family=Hind+Siliguri:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.14/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-left">
        <button class="nav-toggle" type="button" aria-controls="drawer" aria-expanded="false" data-i18n-aria="nav.toggle"><span></span><span></span><span></span></button>
      </div>
      <a class="brand" href="index.html" aria-label="Sofra"><span class="logo"></span></a>
      <div class="header-cta">
        <a class="book" href="reservations.html" data-i18n="nav.reserve"></a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="bn" aria-pressed="false">বাং</button>
        </div>
      </div>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="logo" role="img" aria-label="Sofra"></span>
      <button class="drawer-close" type="button"><span data-i18n="nav.close"></span> ✕</button>
    </div>
    <nav aria-label="Main">
      <a href="index.html"><span data-i18n="nav.home"></span><small>Ana Sayfa</small></a>
      <a href="about.html"><span data-i18n="nav.about"></span><small>Hakkımızda</small></a>
      <a href="menu.html"><span data-i18n="nav.menu"></span><small>Menüler</small></a>
      <a href="index.html#table"><span data-i18n="nav.table"></span><small>Sofra Tabakları</small></a>
      <a href="index.html#events"><span data-i18n="nav.events"></span><small>Etkinlikler</small></a>
      <a href="gallery.html"><span data-i18n="nav.gallery"></span><small>Galeri</small></a>
      <a href="reservations.html"><span data-i18n="nav.reserve"></span><small>Rezervasyon</small></a>
    </nav>
    <div class="meta">
      <p data-i18n="contact.address"></p>
      <p><a href="tel:" data-site="phone"></a><br><a href="mailto:" data-site="email"></a></p>
      <p data-i18n="top.hours"></p>
    </div>
  </aside>

  <main>
    <section class="hero hero-page">
      <div class="media"><img src="assets/img/photos/hero-about.jpg" alt="The Sofra dining room" width="1600" height="1067" fetchpriority="high"></div>
      <div class="content">
        <p class="eyebrow" data-i18n="about.eyebrow"></p>
        <h1 data-i18n="about.title" data-i18n-title="about.title"></h1>
        <div class="rule"></div>
        <p data-i18n="about.p1"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split reveal">
        <div class="duo">
          <img src="assets/img/photos/interior-3.jpg" alt="Arched lantern niches in the dining room" loading="lazy" width="788" height="1400">
          <img src="assets/img/photos/interior-4.jpg" alt="A table laid with patterned runners" loading="lazy" width="1050" height="1400">
        </div>
        <div class="text left">
          <p class="eyebrow" data-i18n="rest.eyebrow"></p>
          <h2 class="section-title"><span data-i18n="rest.title"></span><span class="tr">Hikâyemiz</span></h2>
          <div class="rule"></div>
          <p data-i18n="about.p2"></p>
          <p data-i18n="about.p3"></p>
        </div>
      </div>
    </section>

    <section class="section tight center" style="padding-top:0">
      <div class="container reveal">
        <h2 class="section-title" data-i18n="about.slider.title"></h2>
        <div class="rule"></div>
        <div class="swiper card-slider">
          <div class="swiper-wrapper">
            <div class="swiper-slide"><figure><img src="assets/img/photos/interior-1.jpg" alt="Dining room with patterned chairs" loading="lazy" width="788" height="1400"></figure></div>
            <div class="swiper-slide"><figure><img src="assets/img/photos/interior-2.jpg" alt="Tables by the lantern wall" loading="lazy" width="608" height="1080"></figure></div>
            <div class="swiper-slide"><figure><img src="assets/img/photos/interior-6.jpg" alt="The long table laid for a group" loading="lazy" width="934" height="1400"></figure></div>
            <div class="swiper-slide"><figure><img src="assets/img/photos/soup.jpg" alt="Lentil soup beside a lantern" loading="lazy" width="934" height="1400"></figure></div>
            <div class="swiper-slide"><figure><img src="assets/img/photos/interior-5.jpg" alt="The chef beside the long board" loading="lazy" width="934" height="1400"></figure></div>
            <div class="swiper-slide"><figure><img src="assets/img/photos/calamari-3.jpg" alt="Calamari with dried flowers" loading="lazy" width="933" height="1400"></figure></div>
          </div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-prev" aria-label="Previous"></div>
          <div class="swiper-button-next" aria-label="Next"></div>
        </div>
      </div>
    </section>

    <section class="parallax" data-parallax-box>
      <div class="bg"><img src="assets/img/photos/board-candle.jpg" alt="" loading="lazy" width="1280" height="1280" data-speed=".7"></div>
      <div class="content reveal">
        <span class="logo" role="img" aria-label="Sofra"></span>
        <div class="stats" data-stagger>
          <div class="stat"><div class="num">7</div><div class="label" data-i18n="about.stat.1"></div></div>
          <div class="stat"><div class="num">1</div><div class="label" data-i18n="about.stat.2"></div></div>
          <div class="stat"><div class="num">40</div><div class="label" data-i18n="about.stat.3"></div></div>
          <div class="stat"><div class="num">100%</div><div class="label" data-i18n="about.stat.4"></div></div>
        </div>
      </div>
    </section>

    <section class="section center">
      <div class="container reveal">
        <h2 class="section-title" data-i18n="about.values.title"></h2>
        <div class="rule"></div>
        <div class="values" data-stagger>
          <div class="value"><div class="num">i</div><h3 data-i18n="about.v1.title"></h3><p data-i18n="about.v1.text"></p></div>
          <div class="value"><div class="num">ii</div><h3 data-i18n="about.v2.title"></h3><p data-i18n="about.v2.text"></p></div>
          <div class="value"><div class="num">iii</div><h3 data-i18n="about.v3.title"></h3><p data-i18n="about.v3.text"></p></div>
          <div class="value"><div class="num">iv</div><h3 data-i18n="about.v4.title"></h3><p data-i18n="about.v4.text"></p></div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container split reverse reveal">
        <div class="frame fx-img"><img src="assets/img/photos/interior-5.jpg" alt="The chef beside the long board" loading="lazy" width="934" height="1400"></div>
        <div class="text left">
          <p class="eyebrow" data-i18n="about.chef.eyebrow"></p>
          <h2 class="section-title"><span data-i18n="about.chef.title"></span><span class="tr">Şefimiz</span></h2>
          <div class="rule"></div>
          <p data-i18n="about.chef.text"></p>
          <a class="btn" href="menu.html" data-i18n="about.cta"></a>
        </div>
      </div>
    </section>

    <section class="strip">
      <figure class="fx-img" data-parallax-box><img src="assets/img/photos/kofte-3.jpg" alt="Köfte with fries and rice" loading="lazy" width="1400" height="934" data-speed=".9"></figure>
      <figure class="fx-img" data-parallax-box><img src="assets/img/photos/lamb-chops.jpg" alt="Lamb chops on a board" loading="lazy" width="933" height="1400" data-speed="1.1"></figure>
      <figure class="fx-img" data-parallax-box><img src="assets/img/photos/haydari.jpg" alt="Haydari and warm bread" loading="lazy" width="933" height="1400" data-speed=".9"></figure>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="grid">
        <div>
          <a class="brand" href="index.html" aria-label="Sofra"><span class="logo"></span></a>
          <p data-i18n="meta.tagline"></p>
        </div>
        <div>
          <h4 data-i18n="footer.visit"></h4>
          <ul>
            <li data-i18n="contact.address"></li>
            <li><a href="tel:" data-site="phone"></a></li>
            <li><a href="mailto:" data-site="email"></a></li>
            <li><a href="#" data-site="map" data-i18n="contact.map"></a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.hours"></h4>
          <ul>
            <li data-i18n="footer.hours.1"></li>
            <li data-i18n="footer.hours.2"></li>
            <li data-i18n="res.hours.lunch"></li>
            <li data-i18n="res.hours.dinner"></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.legal"></h4>
          <ul>
            <li><a href="reservations.html" data-i18n="nav.reserve"></a></li>
            <li><a href="#" data-i18n="footer.work"></a></li>
            <li><a href="#" data-i18n="footer.privacy"></a></li>
          </ul>
        </div>
      </div>
      <div class="legal">
        <span data-i18n="footer.rights"></span>
        <span>sofra.com.bd</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.14/swiper-bundle.min.js"></script>
  <script src="assets/js/effects.js"></script>
</body>
</html>
